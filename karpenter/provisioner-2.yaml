apiVersion: karpenter.sh/v1alpha5
kind: Provisioner

metadata:
  name: team1

spec:
  labels:
    intent: apps

  requirements:
    - key: karpenter.sh/capacity-type
      operator: In
      values:
        - on-demand

    - key: node.kubernetes.io/instance-type
      operator: In
      values:
        - t3.medium

    - key: kubernetes.io/os
      operator: In
      values:
        - linux

    - key: kubernetes.io/arch
      operator: In
      values:
        - amd64

  limits:
    resources:
      cpu: "50"
      memory: "50Gi"

  ttlSecondsAfterEmpty: 30

  ttlSecondsUntilExpired: 2592000

  taints:
    - effect: NoSchedule
      key: team1

  providerRef:
    name: roboshop-aws-node-template