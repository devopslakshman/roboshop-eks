apiVersion: karpenter.sh/v1alpha5
kind: Provisioner

metadata:
  name: roboshop-ondemand-provisioner

spec:
  ttlSecondsUntilExpired: 2592000

  consolidation:
    enabled: true

  limits:
    resources:
      cpu: "10k"

  requirements:
    - key: node.kubernetes.io/instance-type
      operator: In
      values:
        - t3.medium

    - key: karpenter.sh/capacity-type
      operator: In
      values:
        - on-demand

    - key: kubernetes.io/os
      operator: In
      values:
        - linux

    - key: kubernetes.io/arch
      operator: In
      values:
        - amd64

  providerRef:
    name: roboshop-aws-node-template